<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 820" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="depShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2.5" flood-opacity="0.12" />
    </filter>
    <marker id="depArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1E3A8A" />
    </marker>
    <marker id="depArrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="depArrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#7C3AED" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="1100" height="42" rx="8" fill="#1E293B" />
  <text x="570" y="42" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">UML DEPLOYMENT DIAGRAM - PRODUCTION CLOUD ENVIRONMENT (Task 3.2 - I-08 / TV1)</text>

  <!-- Zone 1: User Device -->
  <rect x="20" y="75" width="220" height="230" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.8" filter="url(#depShadow)" />
  <rect x="20" y="75" width="220" height="30" rx="10" fill="#E2E8F0" />
  <text x="130" y="95" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;device&gt;&gt; User Smartphone</text>

  <rect x="35" y="120" width="190" height="160" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="130" y="145" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">Mobile Browser / PWA</text>
  <line x1="45" y1="155" x2="215" y2="155" stroke="#BFDBFE" />
  <text x="50" y="175" font-size="10" fill="#1E293B">• Chrome / Safari / Edge</text>
  <text x="50" y="195" font-size="10" fill="#1E293B">• Service Worker &amp; Cache</text>
  <text x="50" y="215" font-size="10" fill="#1E293B">• LocalStorage Cart State</text>
  <text x="50" y="235" font-size="10" fill="#1E293B">• Viewport: 360px - 430px</text>
  <text x="50" y="255" font-size="10" fill="#1E293B">• HTTPS Client Protocols</text>

  <!-- Zone 2: CI / CD Pipeline (GitHub Actions) -->
  <rect x="20" y="330" width="220" height="465" rx="10" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.8" filter="url(#depShadow)" />
  <rect x="20" y="330" width="220" height="30" rx="10" fill="#EDE9FE" />
  <text x="130" y="350" font-size="11" font-weight="bold" fill="#5B21B6" text-anchor="middle">&lt;&lt;CI/CD&gt;&gt; GitHub Actions</text>

  <rect x="35" y="375" width="190" height="150" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.2" />
  <text x="130" y="398" font-size="11" font-weight="bold" fill="#6D28D9" text-anchor="middle">Workflow Runners</text>
  <text x="50" y="420" font-size="10" fill="#1E293B">1. Install dependencies</text>
  <text x="50" y="440" font-size="10" fill="#1E293B">2. Lint &amp; Type-Check</text>
  <text x="50" y="460" font-size="10" fill="#1E293B">3. Unit Tests &amp; Service DB</text>
  <text x="50" y="480" font-size="10" fill="#1E293B">4. Docker Multi-Stage Build</text>
  <text x="50" y="500" font-size="10" fill="#1E293B">5. Quality Gate Pass / Fail</text>

  <!-- CI Secrets -->
  <rect x="35" y="540" width="190" height="110" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2" />
  <text x="130" y="563" font-size="10.5" font-weight="bold" fill="#B45309" text-anchor="middle">&lt;&lt;secrets&gt;&gt; CI Secrets Vault</text>
  <text x="45" y="585" font-size="9.5" fill="#78350F">• GHCR_REGISTRY_TOKEN</text>
  <text x="45" y="605" font-size="9.5" fill="#78350F">• PROD_DEPLOY_WEBHOOK</text>
  <text x="45" y="625" font-size="9.5" fill="#78350F">• DATABASE_URL_TEST</text>

  <!-- Container Registry -->
  <rect x="35" y="665" width="190" height="110" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2" />
  <text x="130" y="688" font-size="10.5" font-weight="bold" fill="#065F46" text-anchor="middle">&lt;&lt;registry&gt;&gt; Docker Registry</text>
  <text x="45" y="710" font-size="9" fill="#064E3B">• ghcr.io/brewlite-web:sha</text>
  <text x="45" y="730" font-size="9" fill="#064E3B">• ghcr.io/brewlite-api:sha</text>
  <text x="45" y="750" font-size="9" fill="#064E3B">• SemVer Tags (v1.0.0)</text>

  <!-- Zone 3: Production Cloud Platform -->
  <rect x="270" y="75" width="850" height="720" rx="12" fill="#F8FAFC" stroke="#0284C7" stroke-width="2" filter="url(#depShadow)" />
  <rect x="270" y="75" width="850" height="35" rx="12" fill="#E0F2FE" />
  <text x="695" y="98" font-size="13" font-weight="bold" fill="#0369A1" text-anchor="middle">&lt;&lt;Cloud Platform&gt;&gt; Production Environment (Railway / Render / VPS Host)</text>

  <!-- Reverse Proxy / Ingress SSL -->
  <rect x="300" y="130" width="790" height="95" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
  <rect x="300" y="130" width="790" height="24" rx="8" fill="#BAE6FD" />
  <text x="695" y="147" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">&lt;&lt;Edge Ingress&gt;&gt; Reverse Proxy &amp; SSL/TLS Terminator (Port 443 HTTPS)</text>
  
  <text x="320" y="175" font-size="10.5" font-weight="bold" fill="#0F172A">Domain Web:</text>
  <text x="410" y="175" font-size="10" fill="#2563EB">https://app.brewlite.example.com  ➔  Chuyển tiếp nội bộ về Web Container (Port 3000)</text>
  <text x="320" y="200" font-size="10.5" font-weight="bold" fill="#0F172A">Domain API:</text>
  <text x="410" y="200" font-size="10" fill="#2563EB">https://api.brewlite.example.com  ➔  Chuyển tiếp nội bộ về API Container (Port 3001)</text>

  <!-- Internal Bridge Network Boundary -->
  <rect x="300" y="245" width="790" height="530" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="315" y="235" width="370" height="20" rx="4" fill="#16A34A" />
  <text x="500" y="249" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Private Docker Network (172.28.0.0/16 - Không mở Port ra ngoài)</text>

  <!-- Container 1: Web App -->
  <rect x="330" y="275" width="350" height="230" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
  <rect x="330" y="275" width="350" height="26" rx="8" fill="#DBEAFE" />
  <text x="505" y="293" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">&lt;&lt;container&gt;&gt; brewlite-web (Next.js PWA)</text>
  <text x="345" y="325" font-size="10" fill="#1E293B">• Base Image: node:20-alpine</text>
  <text x="345" y="345" font-size="10" fill="#1E293B">• Internal Listening: 0.0.0.0:3000</text>
  <text x="345" y="365" font-size="10" fill="#1E293B">• React Server Components &amp; Client SSR/SSG</text>
  <text x="345" y="385" font-size="10" fill="#1E293B">• Mobile-first PWA Manifest &amp; Offline Worker</text>
  <text x="345" y="405" font-size="10" fill="#1E293B">• Runtime Env: NEXT_PUBLIC_API_URL</text>
  <rect x="590" y="445" width="75" height="45" rx="4" fill="#EFF6FF" stroke="#3B82F6" />
  <text x="627" y="465" font-size="9" font-weight="bold" fill="#1E40AF" text-anchor="middle">Port 3000</text>
  <text x="627" y="478" font-size="8" fill="#64748B" text-anchor="middle">(Private)</text>

  <!-- Container 2: API Server -->
  <rect x="715" y="275" width="355" height="230" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
  <rect x="715" y="275" width="355" height="26" rx="8" fill="#FEF3C7" />
  <text x="892" y="293" font-size="11" font-weight="bold" fill="#92400E" text-anchor="middle">&lt;&lt;container&gt;&gt; brewlite-api (NestJS Server)</text>
  <text x="730" y="325" font-size="10" fill="#1E293B">• Base Image: node:20-alpine (Multi-stage)</text>
  <text x="730" y="345" font-size="10" fill="#1E293B">• Internal Listening: 0.0.0.0:3001</text>
  <text x="730" y="365" font-size="10" fill="#1E293B">• TypeORM Data Layer &amp; Auto-Migration</text>
  <text x="730" y="385" font-size="10" fill="#1E293B">• Health Endpoint: GET /api/v1/health</text>
  <text x="730" y="405" font-size="10" fill="#1E293B">• Structured JSON Logger (stdout)</text>
  <rect x="975" y="445" width="75" height="45" rx="4" fill="#FFFBEB" stroke="#F59E0B" />
  <text x="1012" y="465" font-size="9" font-weight="bold" fill="#B45309" text-anchor="middle">Port 3001</text>
  <text x="1012" y="478" font-size="8" fill="#78350F" text-anchor="middle">(Private)</text>

  <!-- Container 3: Database & Persistent Storage -->
  <rect x="330" y="530" width="450" height="225" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
  <rect x="330" y="530" width="450" height="26" rx="8" fill="#E0E7FF" />
  <text x="555" y="548" font-size="11" font-weight="bold" fill="#3730A3" text-anchor="middle">&lt;&lt;database&gt;&gt; PostgreSQL 16 (Private Isolated Engine)</text>
  <text x="345" y="580" font-size="10" fill="#1E293B">• Port 5432 (Chỉ mở nội bộ cho API container, KHÔNG public ra Internet)</text>
  <text x="345" y="600" font-size="10" fill="#1E293B">• ACID Isolation Level: READ COMMITTED</text>
  <text x="345" y="620" font-size="10" fill="#1E293B">• Connection Pool: TypeORM Pool Max 10 connections</text>
  
  <rect x="345" y="640" width="415" height="95" rx="6" fill="#F1F5F9" stroke="#94A3B8" />
  <text x="552" y="660" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">&lt;&lt;storage&gt;&gt; Persistent Volume Mount</text>
  <text x="355" y="682" font-size="9" fill="#1E293B">• Host Path: /var/lib/docker/volumes/brewlite_pgdata/_data</text>
  <text x="355" y="700" font-size="9" fill="#1E293B">• Mount Point: /var/lib/postgresql/data</text>
  <text x="355" y="718" font-size="9" fill="#1E293B">• Đảm bảo dữ liệu không bị mất khi restart container hoặc update version</text>

  <!-- Container 4: Environment & Secrets Manager -->
  <rect x="805" y="530" width="265" height="225" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
  <rect x="805" y="530" width="265" height="26" rx="8" fill="#FEE2E2" />
  <text x="937" y="548" font-size="11" font-weight="bold" fill="#991B1B" text-anchor="middle">&lt;&lt;secrets&gt;&gt; Production Secrets</text>
  <text x="815" y="580" font-size="9" fill="#7F1D1D">• DB_USER, DB_PASSWORD</text>
  <text x="815" y="602" font-size="9" fill="#7F1D1D">• JWT_SECRET (>= 32 chars)</text>
  <text x="815" y="624" font-size="9" fill="#7F1D1D">• PAYMENT_MOCK_SECRET</text>
  <text x="815" y="646" font-size="9" fill="#7F1D1D">• CORS_ORIGIN (Whitelisted)</text>
  <text x="815" y="668" font-size="9" fill="#7F1D1D">• NODE_ENV=production</text>
  <text x="815" y="695" font-size="8.5" fill="#4B5563" font-style="italic">Được inject trực tiếp qua CI/CD</text>
  <text x="815" y="710" font-size="8.5" fill="#4B5563" font-style="italic">hoặc Cloud Environment Variables</text>

  <!-- Connectors -->
  <!-- User to Reverse Proxy -->
  <path d="M 225 175 L 300 175" stroke="#1E3A8A" stroke-width="2" marker-end="url(#depArr)" />
  <text x="260" y="165" font-size="9" font-weight="bold" fill="#1E3A8A">HTTPS</text>

  <!-- Proxy to Web Container -->
  <path d="M 505 225 L 505 275" stroke="#0284C7" stroke-width="1.8" marker-end="url(#depArr)" />

  <!-- Proxy to API Container -->
  <path d="M 892 225 L 892 275" stroke="#0284C7" stroke-width="1.8" marker-end="url(#depArr)" />

  <!-- API to Database -->
  <path d="M 800 505 L 800 580 L 780 580" stroke="#16A34A" stroke-width="2" marker-end="url(#depArrGreen)" />
  <text x="810" y="550" font-size="9" font-weight="bold" fill="#166534">TCP 5432 (Private)</text>

  <!-- CI to Registry -->
  <path d="M 130 525 L 130 665" stroke="#7C3AED" stroke-width="2" marker-end="url(#depArrPurple)" />
  <text x="140" y="650" font-size="8.5" fill="#7C3AED">Push Image Tag SHA</text>

  <!-- Registry to Cloud Deployment -->
  <path d="M 225 720 L 270 720" stroke="#059669" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#depArrGreen)" />
  <text x="235" y="710" font-size="8.5" fill="#059669">Deploy Hook</text>
</svg>
