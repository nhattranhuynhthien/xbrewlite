<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1" />
    </filter>
    <marker id="actArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#374151" />
    </marker>
    <marker id="errArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="15" width="1060" height="42" rx="8" fill="#1E293B" />
  <text x="550" y="42" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle">ACTIVITY DIAGRAM: LUỒNG END-TO-END ĐẶT VÀ THANH TOÁN (Task 2.1 - I-10)</text>

  <!-- Swimlanes Backgrounds -->
  <!-- 1. Customer (Width: 260) -->
  <rect x="20" y="65" width="260" height="900" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" />
  <rect x="20" y="65" width="260" height="35" fill="#3B82F6" />
  <text x="150" y="88" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Khách hàng (Customer)</text>

  <!-- 2. Next.js Frontend (Width: 260) -->
  <rect x="280" y="65" width="265" height="900" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
  <rect x="280" y="65" width="265" height="35" fill="#10B981" />
  <text x="412" y="88" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Next.js Frontend (PWA)</text>

  <!-- 3. NestJS Backend (Width: 275) -->
  <rect x="545" y="65" width="275" height="900" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1.5" />
  <rect x="545" y="65" width="275" height="35" fill="#F59E0B" />
  <text x="682" y="88" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">NestJS Backend (API)</text>

  <!-- 4. Payment Mock Service (Width: 260) -->
  <rect x="820" y="65" width="260" height="900" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5" />
  <rect x="820" y="65" width="260" height="35" fill="#EC4899" />
  <text x="950" y="88" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle">Payment Mock Service</text>

  <!-- Step 1: Start node -->
  <circle cx="150" cy="120" r="11" fill="#1E293B" />
  <path d="M 150 131 L 150 150" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Action: View Menu -->
  <rect x="60" y="150" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="150" y="173" font-size="11" fill="#1E3A8A" font-weight="bold" text-anchor="middle">Duyệt Menu &amp; Chọn Size/Topping</text>
  <path d="M 150 186 L 150 205" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Action: Add to Cart -->
  <rect x="60" y="205" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="150" y="228" font-size="11" fill="#1E3A8A" font-weight="bold" text-anchor="middle">Bấm "Thêm vào giỏ hàng"</text>
  <path d="M 240 223 L 325 223" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Step 2: FE update state & local storage -->
  <rect x="325" y="205" width="175" height="36" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="412" y="222" font-size="10.5" fill="#065F46" text-anchor="middle">Cập nhật Giỏ (State)</text>
  <text x="412" y="235" font-size="9.5" fill="#047857" text-anchor="middle">&amp; Lưu LocalStorage</text>
  <path d="M 412 241 L 412 265 L 150 265 L 150 285" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Step 3: Checkout -->
  <rect x="60" y="285" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#boxShadow)" />
  <text x="150" y="308" font-size="11" fill="#1E3A8A" font-weight="bold" text-anchor="middle">Mở Giỏ &amp; Bấm "Đặt hàng"</text>
  <path d="M 240 303 L 340 303" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Decision 1: Authenticated? (FE) -->
  <polygon points="412,285 455,303 412,321 369,303" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
  <text x="412" y="307" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">Đã đăng nhập?</text>

  <!-- Branch: Not Logged in (Error/Alt 1) -->
  <path d="M 412 321 L 412 350" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />
  <text x="435" y="338" font-size="9" fill="#DC2626" font-weight="bold">Chưa</text>

  <rect x="325" y="350" width="175" height="42" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
  <text x="412" y="367" font-size="10" fill="#991B1B" font-weight="bold" text-anchor="middle">Redirect sang /login</text>
  <text x="412" y="382" font-size="9" fill="#B91C1C" text-anchor="middle">Lưu query redirect=/checkout</text>

  <path d="M 325 371 L 240 371" stroke="#374151" stroke-width="1.5" marker-end="url(#actArr)" />
  <rect x="60" y="350" width="180" height="42" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="150" y="367" font-size="10.5" fill="#1E3A8A" text-anchor="middle">Khách nhập Email &amp; Pass</text>
  <text x="150" y="382" font-size="9.5" fill="#2563EB" text-anchor="middle">Bấm "Đăng nhập"</text>

  <path d="M 150 392 L 150 415 L 325 415" stroke="#374151" stroke-width="1.5" marker-end="url(#actArr)" />
  <rect x="325" y="400" width="175" height="32" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
  <text x="412" y="420" font-size="10" fill="#065F46" text-anchor="middle">Lưu JWT &amp; Quay lại Checkout</text>

  <!-- Connect back to Checkout flow -->
  <path d="M 455 303 L 505 303 L 505 455 L 150 455 L 150 480" stroke="#10B981" stroke-width="1.5" marker-end="url(#actArr)" />
  <text x="475" y="295" font-size="9" fill="#059669" font-weight="bold">Đã login</text>
  <path d="M 412 432 L 412 445 L 240 445 L 240 480" stroke="#10B981" stroke-width="1.5" />

  <!-- Customer confirms checkout -->
  <rect x="60" y="480" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="150" y="497" font-size="10.5" fill="#1E3A8A" font-weight="bold" text-anchor="middle">Chọn Ví/Thẻ &amp; Bấm</text>
  <text x="150" y="510" font-size="9.5" fill="#2563EB" text-anchor="middle">"Xác nhận đặt hàng"</text>
  <path d="M 240 498 L 325 498" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- FE calls POST /orders -->
  <rect x="325" y="480" width="175" height="36" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
  <text x="412" y="496" font-size="10.5" fill="#065F46" font-weight="bold" text-anchor="middle">POST /api/v1/orders</text>
  <text x="412" y="509" font-size="9" fill="#047857" text-anchor="middle">Header Authorization Bearer</text>
  <path d="M 500 498 L 575 498" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Backend Transaction & Stock Check -->
  <rect x="575" y="475" width="220" height="46" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
  <text x="685" y="494" font-size="10.5" fill="#B45309" font-weight="bold" text-anchor="middle">Mở Database Transaction</text>
  <text x="685" y="508" font-size="9.5" fill="#92400E" text-anchor="middle">Kiểm tra tồn kho (stock &gt;= qty)</text>
  <path d="M 685 521 L 685 540" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Decision 2: In Stock? (Error/Alt 2) -->
  <polygon points="685,540 730,558 685,576 640,558" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
  <text x="685" y="562" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">Đủ tồn kho?</text>

  <!-- Branch: Out of stock -->
  <path d="M 640 558 L 500 558" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />
  <text x="560" y="550" font-size="9" fill="#DC2626" font-weight="bold">Hết hàng / Thiếu</text>

  <rect x="325" y="540" width="175" height="38" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
  <text x="412" y="556" font-size="10" fill="#991B1B" font-weight="bold" text-anchor="middle">Hiển thị lỗi 400 Bad Request</text>
  <text x="412" y="570" font-size="9" fill="#B91C1C" text-anchor="middle">"Món đã hết hàng trong kho"</text>
  <path d="M 325 558 L 240 558" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />

  <rect x="60" y="540" width="180" height="38" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
  <text x="150" y="556" font-size="10" fill="#991B1B" font-weight="bold" text-anchor="middle">Khách sửa lại giỏ hàng</text>
  <text x="150" y="570" font-size="9" fill="#B91C1C" text-anchor="middle">(Chọn món khác / Giảm SL)</text>

  <!-- Branch: In stock -> Commit order -->
  <path d="M 685 576 L 685 600" stroke="#10B981" stroke-width="1.8" marker-end="url(#actArr)" />
  <text x="705" y="590" font-size="9" fill="#059669" font-weight="bold">Đủ hàng</text>

  <rect x="575" y="600" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
  <text x="685" y="617" font-size="10" fill="#B45309" text-anchor="middle">Tính giá chuẩn &amp; Trừ tồn kho</text>
  <text x="685" y="632" font-size="10" fill="#B45309" font-weight="bold" text-anchor="middle">Commit Order (PENDING_PAYMENT)</text>
  <path d="M 575 622 L 500 622" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- FE receives orderId & calls POST /payments -->
  <rect x="325" y="605" width="175" height="42" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
  <text x="412" y="622" font-size="10" fill="#065F46" font-weight="bold" text-anchor="middle">Tạo Idempotency-Key (UUID)</text>
  <text x="412" y="636" font-size="9.5" fill="#047857" text-anchor="middle">Gọi POST /api/v1/payments</text>
  <path d="M 412 647 L 412 670 L 575 670" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Backend Idempotency Check -->
  <rect x="575" y="655" width="220" height="42" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" />
  <text x="685" y="672" font-size="10" fill="#B45309" font-weight="bold" text-anchor="middle">Kiểm tra Idempotency-Key</text>
  <text x="685" y="686" font-size="9" fill="#92400E" text-anchor="middle">(Chống thanh toán trừ tiền trùng)</text>
  <path d="M 795 675 L 850 675" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Payment Mock Service Processing -->
  <rect x="850" y="655" width="200" height="42" rx="6" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5" />
  <text x="950" y="673" font-size="10" fill="#9D174D" font-weight="bold" text-anchor="middle">Xử lý Ví/Thẻ Mô phỏng</text>
  <text x="950" y="687" font-size="9" fill="#BE185D" text-anchor="middle">(Kiểm tra số dư &amp; mã thẻ)</text>
  <path d="M 950 697 L 950 725" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Decision 3: Payment Success? (Error/Alt 3) -->
  <polygon points="950,725 995,743 950,761 905,743" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5" />
  <text x="950" y="747" font-size="9" font-weight="bold" fill="#854D0E" text-anchor="middle">Giao dịch OK?</text>

  <!-- Branch: Payment Failed -->
  <path d="M 905 743 L 795 743" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />
  <text x="840" y="736" font-size="9" fill="#DC2626" font-weight="bold">Thất bại</text>

  <rect x="575" y="725" width="220" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
  <text x="685" y="741" font-size="9.5" fill="#991B1B" font-weight="bold" text-anchor="middle">Lưu Payment (FAILED)</text>
  <text x="685" y="753" font-size="8.5" fill="#B91C1C" text-anchor="middle">Order giữ PENDING_PAYMENT</text>

  <path d="M 575 743 L 500 743" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />
  <rect x="325" y="725" width="175" height="36" rx="6" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5" />
  <text x="412" y="741" font-size="9.5" fill="#991B1B" font-weight="bold" text-anchor="middle">Báo lỗi thanh toán</text>
  <text x="412" y="753" font-size="8.5" fill="#B91C1C" text-anchor="middle">Hiển thị nút "Thử lại"</text>

  <path d="M 325 743 L 240 743" stroke="#DC2626" stroke-width="1.5" marker-end="url(#errArr)" />
  <rect x="60" y="725" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" />
  <text x="150" y="741" font-size="9.5" fill="#991B1B" font-weight="bold" text-anchor="middle">Khách đổi phương thức</text>
  <text x="150" y="753" font-size="8.5" fill="#B91C1C" text-anchor="middle">hoặc Bấm Thử lại</text>

  <!-- Branch: Payment Success -->
  <path d="M 950 761 L 950 790 L 795 790" stroke="#10B981" stroke-width="1.8" marker-end="url(#actArr)" />
  <text x="965" y="780" font-size="9" fill="#059669" font-weight="bold">Thành công</text>

  <rect x="575" y="775" width="220" height="42" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" />
  <text x="685" y="792" font-size="10" fill="#065F46" font-weight="bold" text-anchor="middle">Lưu Payment (SUCCESS)</text>
  <text x="685" y="806" font-size="9.5" fill="#047857" text-anchor="middle">Đổi Order.status = "PAID"</text>
  <path d="M 575 796 L 500 796" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- FE Clears Cart & Navigates to Tracking -->
  <rect x="325" y="775" width="175" height="42" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5" />
  <text x="412" y="792" font-size="10" fill="#065F46" font-weight="bold" text-anchor="middle">Xóa giỏ (clearCart)</text>
  <text x="412" y="806" font-size="9.5" fill="#047857" text-anchor="middle">Chuyển sang trang /orders/:id</text>
  <path d="M 325 796 L 240 796" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- Customer watches live tracking -->
  <rect x="60" y="775" width="180" height="42" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
  <text x="150" y="792" font-size="10.5" fill="#1E3A8A" font-weight="bold" text-anchor="middle">Xem Mã Đơn &amp; Tiến trình</text>
  <text x="150" y="806" font-size="9.5" fill="#2563EB" text-anchor="middle">Trạng thái: "Đã thanh toán"</text>
  <path d="M 150 817 L 150 855" stroke="#374151" stroke-width="1.8" marker-end="url(#actArr)" />

  <!-- End Node -->
  <circle cx="150" cy="870" r="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
  <circle cx="150" cy="870" r="8" fill="#1E293B" />
  <text x="150" y="905" font-size="11" font-weight="bold" fill="#1E293B" text-anchor="middle">Hoàn tất Đặt hàng</text>
</svg>
